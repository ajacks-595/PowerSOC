# PowerSOC Prometheus alert rules. Load via rule_files in prometheus.yml.
groups:
  - name: powersoc
    rules:
      - alert: PowerSOCScrapeDown
        expr: up{job="powersoc"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "PowerSOC /metrics unreachable"
          description: "Prometheus can't scrape PowerSOC (inverter or app may be down)."

      - alert: PowerSOCBatteryLow
        expr: powersoc_battery_soc_percent < 15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Battery SoC low ({{ $value }}%)"
          description: "Battery has been below 15% for 10 minutes."

      - alert: PowerSOCHighNetCostToday
        expr: powersoc_today_net_cost_pence > 800
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Today's net cost is high (£{{ $value | humanize }}p)"
          description: "Net cost so far today has exceeded £8."
